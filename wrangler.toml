name = "lun-thai-lek"
compatibility_date = "2025-01-01"
pages_build_output_dir = "dist"

# Rate-limit counters (best-effort, per hashed IP). Create with:
#   wrangler kv namespace create RATE_LIMIT   -> paste the id below (do this per environment)
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_PREVIEW_KV_NAMESPACE_ID"

# Secrets (set with `wrangler pages secret put NAME`, never here):
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, TURNSTILE_SECRET_KEY
